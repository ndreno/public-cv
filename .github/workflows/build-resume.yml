name: Build and Deploy Resume

permissions:
  contents: write # This grants permission to push commits to the repo
  pages: write    # This grants permission to deploy to GitHub Pages
  id-token: write # Required for OpenID Connect (OIDC) authentication, good practice for GH Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create build directory
        run: mkdir -p build

      - name: Build English Resume
        run: npm run build:en

      - name: Build French Resume
        run: npm run build:fr

      # The US resume ships as a PDF at a stable URL. It is deliberately absent
      # from the language switcher: it is a target market, not a language.
      - name: Install Typst
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst

      - name: Build US Resume (PDF)
        run: npm run build:pdf

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          #cname: your-custom-domain.com # Optional: if custom domain